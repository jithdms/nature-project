<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입 | 탄소 포인트</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
  <div class="auth-container">
    <h2>회원가입</h2>
    <form id="registerForm">
      <input type="text" id="reg-username" placeholder="아이디" required>
      <input type="email" id="reg-email" placeholder="이메일" required>
      <input type="password" id="reg-password" placeholder="비밀번호" required>
      <input type="password" id="reg-confirm" placeholder="비밀번호 확인" required>
      <button type="submit">회원가입</button>
    </form>
    <p>이미 계정이 있으신가요? <a href="{{ url_for('login') }}">로그인</a></p>
  </div>
  <script src="{{ url_for('static', filename='register.js') }}"></script>
</body>
</html>
